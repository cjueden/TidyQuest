name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Type check
        working-directory: server
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: server
        run: npm test

      # The family's time zone (Settings → Time zone) far from the server's: every "today" and "this week"
      # must come from the family's clock, not the server's
      - name: Run tests with the family in another time zone
        working-directory: server
        run: npm test
        env:
          TZ: UTC
          TEST_TIME_ZONE: Pacific/Auckland
